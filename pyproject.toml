[project]
name = "fast-api-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Moinulilm10", email = "moinulilm10@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.9.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.2.3",
    "requests>=2.32.0",
    "streamlit>=1.0",
    "uvicorn[standard]>=0.52.4",
    "httpx2>=2.13.1",
    "anyio<4.15",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end browser tests that require the app stack to be running",
]

[tool.uv]
link-mode = "copy"
